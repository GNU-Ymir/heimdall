name: Build heimdall image
description: >-
  Builds the Dockerfile's `build` stage - the image holding ./heimdall.test, the toolchain and the
  sources - and loads it into the local docker daemon under `tag`. The toolchain build-args have no
  default in the Dockerfile on purpose: YMIR_VERSION at the repo root is the single source of
  truth, and every workflow computes them from it, here.

inputs:
  tag:
    description: The tag to load the built image under.
    required: true
  cache-to:
    description: >-
      "true" in the single job meant to populate the shared layer cache. Every other job leaves it
      false and only reads that cache.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # The jobs of one run queue on the same runner, hence the same docker daemon: by the time a
    # later job asks for the image, the build job has already put it there.
    - name: Look for the image in the local daemon
      id: local
      shell: bash
      run: |
        set -euo pipefail
        if docker image inspect "${{ inputs.tag }}" >/dev/null 2>&1; then
          echo "hit=true" >> "$GITHUB_OUTPUT"
          echo "${{ inputs.tag }} is already loaded - nothing to build"
        else
          echo "hit=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Compute toolchain build-args from YMIR_VERSION
      id: toolchain
      if: steps.local.outputs.hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        . ./YMIR_VERSION
        GCC_MAJOR_VERSION="$(echo "$GCC_VERSION" | cut -d. -f1)"
        {
          echo "gyc_release_tag=${YMIR_BOOTSTRAP_VERSION}"
          echo "gyc_asset=gyc-${GCC_MAJOR_VERSION}_${YMIR_BOOTSTRAP_VERSION}_amd64.deb"
          echo "gyllir_release_tag=${GYLLIR_VERSION}"
          echo "gyllir_asset=gyllir_${GYLLIR_VERSION}_amd64.deb"
        } >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@v4
      if: steps.local.outputs.hit != 'true'

    - uses: docker/build-push-action@v7
      if: steps.local.outputs.hit != 'true'
      with:
        context: .
        target: build
        push: false
        load: true
        tags: ${{ inputs.tag }}
        build-args: |
          GYC_RELEASE_TAG=${{ steps.toolchain.outputs.gyc_release_tag }}
          GYC_ASSET=${{ steps.toolchain.outputs.gyc_asset }}
          GYLLIR_RELEASE_TAG=${{ steps.toolchain.outputs.gyllir_release_tag }}
          GYLLIR_ASSET=${{ steps.toolchain.outputs.gyllir_asset }}
        cache-from: type=gha
        cache-to: ${{ inputs.cache-to == 'true' && 'type=gha,mode=max' || '' }}
